title: AWS Root Account Console Login
id: e06344d4-bc9c-5fb2-99b4-2f579330e5fb
status: experimental
description: Detects a sign-in to the AWS console with the root user. Root is a privileged ID that should not be used for daily work
author: SIEM on Amazon OpenSearch Service
date: 2026/11/01
references:
    - https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference.html
tags:
    - attack.privilege_escalation
    - attack.initial_access
    - attack.t1078.004
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: signin.amazonaws.com
        eventName: ConsoleLogin
        userIdentity.type: Root
    condition: selection
falsepositives:
    - Break-glass use of the root user that is approved and recorded
level: high
