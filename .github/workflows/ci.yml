name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install test requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt
      - name: pytest
        env:
          AWS_DEFAULT_REGION: us-east-1
        run: pytest tests -q
      - name: flake8 (all Python files)
        run: git ls-files '*.py' | xargs flake8
      - name: Version strings are consistent
        run: python deployment/bump_version.py --check

  cfn-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install cfn-lint
        run: pip install cfn-lint==1.59.0
      - name: cfn-lint
        # E1161 / E3031: %%BUCKET_NAME%% placeholders are replaced at build
        # time by deployment/build-s3-dist.sh. Warnings do not fail the job.
        run: >-
          cfn-lint --ignore-checks E1161 E3031 W --non-zero-exit-code error
          -- deployment/*.template deployment/log-exporter/*.template

  cdk-synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install CDK libraries and cfn-lint
        run: |
          pip install -r source/cdk/requirements.txt cfn-lint==1.59.0
      - name: cdk synth (offline, no AWS credentials)
        # AES_SIEM_CDK_OFFLINE skips the IAM / Lambda lookups that the stack
        # makes while synthesizing. The job has no AWS credentials.
        working-directory: source/cdk
        env:
          AES_SIEM_CDK_OFFLINE: 'true'
          AWS_DEFAULT_REGION: us-east-1
          CDK_DEFAULT_REGION: us-east-1
          CDK_DEFAULT_ACCOUNT: '111122223333'
          CDK_OUTDIR: ${{ runner.temp }}/cdk.out
        run: |
          export CDK_CONTEXT_JSON="$(python -c "import json; print(json.dumps(json.load(open('cdk.json.public.sample'))['context']))")"
          python app.py
      - name: OpenSearch UI is opt-in
        # The OpenSearch UI endpoint is public by default. It must stay
        # disabled unless the user sets EnableOpenSearchUi to true.
        run: |
          python - <<'PYEOF'
          import json, os
          t = json.load(open(os.path.join(
              os.environ['RUNNER_TEMP'], 'cdk.out', 'aes-siem.template.json')))
          assert t['Parameters']['EnableOpenSearchUi']['Default'] == 'false'
          for name, res in t['Resources'].items():
              if res['Type'] == 'AWS::OpenSearchService::Application':
                  assert res.get('Condition') == 'CreateOpenSearchUi', name
          print('OpenSearch UI is opt-in')
          PYEOF
      - name: cfn-lint (synthesized template)
        run: >-
          cfn-lint --ignore-checks E1161 E3031 W --non-zero-exit-code error
          -- "${{ runner.temp }}/cdk.out/aes-siem.template.json"
